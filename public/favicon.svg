<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark outer drop shadow for favicon punchiness -->
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Ribbon fold shadow cast by foreground diagonal -->
    <filter id="left-ribbon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="right-ribbon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Netflix Ribbon Gradients -->
    <!-- Left Pillar (Back Layer) -->
    <linearGradient id="nf-pillar-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a070e" />
      <stop offset="45%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#690509" />
    </linearGradient>

    <!-- Right Pillar (Back Layer) -->
    <linearGradient id="nf-pillar-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a070e" />
      <stop offset="45%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#690509" />
    </linearGradient>

    <!-- Left Diagonal Ribbon (Front Layer) -->
    <linearGradient id="nf-diag-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff222b" />
      <stop offset="30%" stop-color="#e50914" />
      <stop offset="75%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#80060b" />
    </linearGradient>

    <!-- Right Diagonal Ribbon (Front Layer with fold) -->
    <linearGradient id="nf-diag-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e36" />
      <stop offset="35%" stop-color="#e50914" />
      <stop offset="75%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#7a060a" />
    </linearGradient>

    <!-- Center crease highlight -->
    <linearGradient id="crease-overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Netflix Black Background (rounded standard) -->
  <rect width="128" height="128" rx="28" fill="#000000" />

  <g filter="url(#m-glow)">
    <!-- 1. Left Vertical Pillar (Background layer) -->
    <path
      d="M 21 16 L 42 16 L 42 112 Q 31.5 110 21 112 Z"
      fill="url(#nf-pillar-left)"
    />

    <!-- 2. Right Vertical Pillar (Background layer) -->
    <path
      d="M 86 16 L 107 16 L 107 112 Q 96.5 110 86 112 Z"
      fill="url(#nf-pillar-right)"
    />

    <!-- 3. Left Diagonal Ribbon (Overlaps Left Pillar, angles to center bottom) -->
    <path
      d="M 21 16 L 42 16 L 64 113 L 44 113 Z"
      fill="url(#nf-diag-left)"
      filter="url(#left-ribbon-shadow)"
    />

    <!-- 4. Right Diagonal Ribbon (Overlaps Right Pillar and folds at center) -->
    <path
      d="M 107 16 L 86 16 L 64 113 L 84 113 Z"
      fill="url(#nf-diag-right)"
      filter="url(#right-ribbon-shadow)"
    />

    <!-- 5. Center Fold Overlay (Giving that 3D ribbon origami crease) -->
    <path
      d="M 64 54 L 64 113 L 73 113 Z"
      fill="url(#crease-overlay)"
    />
  </g>
</svg>
